<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Expenses</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="https://wsrv.nl/?url=raw.githubusercontent.com/venkateshtg95/Family-Expenses-New/main/photo.jpg&w=192&h=192&fit=cover&output=png">
  <link rel="apple-touch-icon" href="https://wsrv.nl/?url=raw.githubusercontent.com/venkateshtg95/Family-Expenses-New/main/photo.jpg&w=192&h=192&fit=cover&output=png">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">Family Expenses</h1>
      <p id="syncStatus" class="text-xs text-indigo-200">Checking network...</p>
    </div>
    <select id="activeMember" class="bg-indigo-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium border border-indigo-500 focus:outline-none">
      <option value="Venkatesha">👤 Venkatesha</option>
      <option value="Anjali">👤 Anjali</option>
      <option value="Utkarsh">👶 Utkarsh</option>
    </select>
  </header>
  
  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- Offline Alert -->
    <div id="offlineAlert" class="hidden bg-amber-100 text-amber-800 p-3 rounded-xl text-xs font-semibold text-center border border-amber-200">
      <span id="pendingCount">0</span> expense(s) waiting to sync. <button onclick="flushOfflineQueue()" class="underline ml-1 font-bold">Retry Now</button>
    </div>

    <!-- Month & Individual Member Filter -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-semibold text-slate-600">📅 Filter Month</label>
        <input type="month" id="monthFilter" onchange="renderUI()" class="text-sm font-semibold text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100 outline-none">
      </div>
      
      <div class="grid grid-cols-4 gap-1.5">
        <button type="button" id="filterAll" onclick="setMemberFilter('All')" class="py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">All</button>
        <button type="button" id="filterVenkatesha" onclick="setMemberFilter('Venkatesha')" class="py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 transition">Venkatesh</button>
        <button type="button" id="filterAnjali" onclick="setMemberFilter('Anjali')" class="py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 transition">Anjali</button>
        <button type="button" id="filterUtkarsh" onclick="setMemberFilter('Utkarsh')" class="py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 transition">Utkarsh</button>
      </div>
    </div>

    <!-- Summary & Budget Progress -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="grid grid-cols-2 gap-3 text-center">
        <div class="bg-indigo-50 p-3 rounded-xl">
          <span id="dailyLabel" class="text-[10px] text-indigo-600 font-semibold block">DAILY EXPENSES (ALL)</span>
          <span id="monthlyTotal" class="text-xl font-bold text-indigo-900">₹0</span>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl">
          <span id="fixedLabel" class="text-[10px] text-emerald-600 font-semibold block">FIXED / INVESTMENTS</span>
          <span id="fixedTotal" class="text-xl font-bold text-emerald-900">₹0</span>
        </div>
      </div>

      <!-- Monthly Budget Progress Bar -->
      <div class="pt-1">
        <div class="flex justify-between items-center text-xs mb-1">
          <span class="font-medium text-slate-600">Daily Budget: <strong id="budgetDisplay">₹25,000</strong></span>
          <div class="flex items-center gap-2">
            <span id="budgetPercent" class="font-bold text-emerald-600">0%</span>
            <button onclick="editBudget()" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md font-semibold">Edit</button>
          </div>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
          <div id="budgetBar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Add / Edit Expense Form -->
    <div id="formCard" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex justify-between items-center mb-3">
        <h2 id="formTitle" class="font-semibold text-slate-700">Add Expense</h2>
        <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden text-xs text-red-500 font-semibold hover:underline">Cancel Edit</button>
      </div>
      
      <form id="expenseForm" onsubmit="handleSubmit(event)" class="space-y-3">
        <input type="hidden" id="editId" value="">
        
        <div class="flex gap-2">
          <button type="button" id="typeDaily" onclick="setExpenseType('Daily')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white">Daily</button>
          <button type="button" id="typeFixed" onclick="setExpenseType('Fixed / Investment')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600">Fixed / Investment</button>
        </div>

        <div>
          <label class="text-xs text-slate-500 font-medium">Amount (₹)</label>
          <input type="number" id="amount" required placeholder="0.00" step="any" class="w-full text-lg font-bold border rounded-xl p-2.5 mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="text-xs text-slate-500 font-medium">Category</label>
          <select id="category" onchange="toggleCustomCategory()" class="w-full border rounded-xl p-2.5 mt-1 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none"></select>
        </div>

        <!-- Custom Category Input (Shows when "Other" is selected) -->
        <div id="customCategoryBox" class="hidden">
          <label class="text-xs text-indigo-600 font-semibold">Specify Category Name</label>
          <input type="text" id="customCategory" placeholder="e.g. Medical, Baby Care, Gift" class="w-full border border-indigo-300 bg-indigo-50/40 rounded-xl p-2.5 mt-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-500 font-medium">Date</label>
            <input type="date" id="date" required class="w-full border rounded-xl p-2.5 mt-1 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-500 font-medium">Payment</label>
            <select id="paymentMode" class="w-full border rounded-xl p-2.5 mt-1 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="UPI">UPI</option>
              <option value="Cash">Cash</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-500 font-medium">Note</label>
          <input type="text" id="note" placeholder="Optional note" class="w-full border rounded-xl p-2 mt-1 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-md shadow-indigo-200">
          Save Expense
        </button>
      </form>
    </div>

    <!-- Visual Analytics Chart -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <h2 id="chartTitle" class="font-semibold text-slate-700 mb-2 text-sm">Category Breakdown (All)</h2>
      <div id="chartContainer" class="relative h-56 flex items-center justify-center">
        <canvas id="expenseChart"></canvas>
        <p id="noChartData" class="hidden text-xs text-slate-400">No expenses for this selection.</p>
      </div>
    </div>

    <!-- Entries List -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex justify-between items-center mb-3">
        <h2 id="listTitle" class="font-semibold text-slate-700 text-sm">Entries (Tap to Edit)</h2>
        <span id="entryCount" class="text-[10px] text-slate-400 font-medium">0 items</span>
      </div>
      <div id="expenseList" class="space-y-2 max-h-72 overflow-y-auto">
        <p class="text-xs text-slate-400 text-center py-4">Loading expenses...</p>
      </div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzaw-zdx5VEaPdun_ioJMgEUb9rxUIvAw0SPOZWehMuBDI-6mQEm_e9VXIb6DLiMufP_Q/exec";
    
    const DEFAULT_CATEGORIES = ["Groceries", "Petrol", "Dining Out", "Utilities", "Chit Fund", "Mutual Fund SIP", "Other"];
    let expenses = JSON.parse(localStorage.getItem('cachedExpenses') || '[]');
    let categories = JSON.parse(localStorage.getItem('cachedCategories') || JSON.stringify(DEFAULT_CATEGORIES));
    let monthlyBudget = Number(localStorage.getItem('cachedBudget') || 25000);
    let offlineQueue = JSON.parse(localStorage.getItem('expenseQueue') || '[]');
    
    let currentType = "Daily";
    let selectedMemberFilter = "All";
    let isSyncing = false;
    let chartInstance = null;

    // Set default date & current month filter
    const today = new Date();
    document.getElementById('date').valueAsDate = today;
    document.getElementById('monthFilter').value = today.toISOString().slice(0, 7);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    window.addEventListener('online', () => {
      updateStatusUI();
      flushOfflineQueue();
    });
    window.addEventListener('offline', updateStatusUI);

    populateCategories();
    renderUI();
    updateStatusUI();
    if (navigator.onLine) flushOfflineQueue();

    function setMemberFilter(member) {
      selectedMemberFilter = member;
      const members = ['All', 'Venkatesha', 'Anjali', 'Utkarsh'];
      members.forEach(m => {
        const btn = document.getElementById('filter' + m);
        if (m === member) {
          btn.className = "py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition";
        } else {
          btn.className = "py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 transition";
        }
      });
      renderUI();
    }

    function populateCategories() {
      const select = document.getElementById('category');
      const currentVal = select.value;
      select.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
      if (categories.includes(currentVal)) select.value = currentVal;
      toggleCustomCategory();
    }

    function toggleCustomCategory() {
      const cat = document.getElementById('category').value;
      const box = document.getElementById('customCategoryBox');
      const input = document.getElementById('customCategory');
      if (cat === 'Other') {
        box.classList.remove('hidden');
        input.required = true;
      } else {
        box.classList.add('hidden');
        input.required = false;
        input.value = '';
      }
    }

    function setExpenseType(type) {
      currentType = type;
      if (type === 'Daily') {
        document.getElementById('typeDaily').className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white";
        document.getElementById('typeFixed').className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600";
      } else {
        document.getElementById('typeFixed').className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 text-white";
        document.getElementById('typeDaily').className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600";
      }
    }

    function updateStatusUI() {
      const alertBox = document.getElementById('offlineAlert');
      const statusEl = document.getElementById('syncStatus');
      if (isSyncing) statusEl.innerText = "Syncing...";
      else if (navigator.onLine) statusEl.innerText = "Online ✅";
      else statusEl.innerText = "Offline Mode ✈️";

      if (offlineQueue.length > 0) {
        alertBox.classList.remove('hidden');
        document.getElementById('pendingCount').innerText = offlineQueue.length;
      } else {
        alertBox.classList.add('hidden');
      }
    }

    async function editBudget() {
      const val = prompt("Enter Monthly Daily Expense Budget (₹):", monthlyBudget);
      if (val === null) return;
      const num = parseFloat(val);
      if (isNaN(num) || num <= 0) return alert("Please enter a valid amount.");
      
      monthlyBudget = num;
      localStorage.setItem('cachedBudget', monthlyBudget);
      renderUI();

      if (navigator.onLine) {
        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "setBudget", budget: monthlyBudget }),
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: 'follow'
          });
        } catch (e) {}
      }
    }

    function startEdit(id) {
      const item = expenses.find(x => x.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('formTitle').innerText = "Edit Expense";
      document.getElementById('submitBtn').innerText = "Update Expense";
      document.getElementById('cancelEditBtn').classList.remove('hidden');

      setExpenseType(item.type || 'Daily');
      document.getElementById('amount').value = item.amount;
      document.getElementById('date').value = item.date;
      document.getElementById('activeMember').value = item.member;
      document.getElementById('paymentMode').value = item.paymentMode;
      document.getElementById('note').value = item.note || '';

      if (categories.includes(item.category)) {
        document.getElementById('category').value = item.category;
        toggleCustomCategory();
      } else {
        document.getElementById('category').value = 'Other';
        toggleCustomCategory();
        document.getElementById('customCategory').value = item.category;
      }

      document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEdit() {
      document.getElementById('editId').value = "";
      document.getElementById('formTitle').innerText = "Add Expense";
      document.getElementById('submitBtn').innerText = "Save Expense";
      document.getElementById('cancelEditBtn').classList.add('hidden');
      document.getElementById('expenseForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      setExpenseType('Daily');
      toggleCustomCategory();
    }

    async function flushOfflineQueue() {
      if (!navigator.onLine || isSyncing) return;
      if (offlineQueue.length === 0) {
        await syncData();
        return;
      }
      
      isSyncing = true;
      updateStatusUI();
      let failed = [];
      
      for (let entry of offlineQueue) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(entry),
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: 'follow'
          });
          if (!res.ok) failed.push(entry);
        } catch (e) {
          failed.push(entry);
        }
      }
      
      offlineQueue = failed;
      localStorage.setItem('expenseQueue', JSON.stringify(offlineQueue));
      isSyncing = false;
      updateStatusUI();
      if (offlineQueue.length === 0) await syncData();
    }

    async function syncData() {
      if (!navigator.onLine) return;
      try {
        const res = await fetch(SCRIPT_URL + '?action=getData', { redirect: 'follow' });
        const json = await res.json();
        if (json.status === 'success') {
          expenses = json.data.reverse();
          localStorage.setItem('cachedExpenses', JSON.stringify(expenses));
          if (json.categories && json.categories.length > 0) {
            categories = json.categories;
            localStorage.setItem('cachedCategories', JSON.stringify(categories));
            populateCategories();
          }
          if (json.budget) {
            monthlyBudget = Number(json.budget);
            localStorage.setItem('cachedBudget', monthlyBudget);
          }
          renderUI();
          updateStatusUI();
        }
      } catch (err) {}
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const btn = document.getElementById('submitBtn');
      btn.innerText = editId ? "Updating..." : "Saving...";
      btn.disabled = true;

      let selectedCat = document.getElementById('category').value;
      if (selectedCat === 'Other') {
        selectedCat = document.getElementById('customCategory').value.trim() || 'Other';
      }

      const entry = {
        action: editId ? "update" : "add",
        id: editId || ('exp_' + Date.now()),
        date: document.getElementById('date').value,
        member: document.getElementById('activeMember').value,
        type: currentType,
        category: selectedCat,
        amount: parseFloat(document.getElementById('amount').value),
        paymentMode: document.getElementById('paymentMode').value,
        note: document.getElementById('note').value
      };

      if (navigator.onLine) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(entry),
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: 'follow'
          });
          if (res.ok) {
            cancelEdit();
            await syncData();
          } else {
            queueOffline(entry, !!editId);
          }
        } catch (err) {
          queueOffline(entry, !!editId);
        }
      } else {
        queueOffline(entry, !!editId);
      }
      
      btn.innerText = "Save Expense";
      btn.disabled = false;
    }

    function queueOffline(entry, isEdit) {
      offlineQueue.push(entry);
      localStorage.setItem('expenseQueue', JSON.stringify(offlineQueue));
      if (isEdit) {
        const idx = expenses.findIndex(x => x.id === entry.id);
        if (idx !== -1) expenses[idx] = entry;
      } else {
        expenses.unshift(entry);
      }
      localStorage.setItem('cachedExpenses', JSON.stringify(expenses));
      cancelEdit();
      updateStatusUI();
      renderUI();
    }

    async function deleteExpense(e, id) {
      e.stopPropagation();
      if (!confirm("Delete this entry?")) return;
      if (!navigator.onLine) return alert("You must be online to delete entries.");
      
      document.getElementById('syncStatus').innerText = "Deleting...";
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: "delete", id: id }),
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          redirect: 'follow'
        });
        await syncData();
      } catch (err) {}
      updateStatusUI();
    }

    function renderUI() {
      const selectedMonth = document.getElementById('monthFilter').value;
      const filtered = expenses.filter(item => {
        const matchMonth = !selectedMonth || String(item.date).startsWith(selectedMonth);
        const matchMember = selectedMemberFilter === 'All' || item.member === selectedMemberFilter;
        return matchMonth && matchMember;
      });

      const displayLabel = selectedMemberFilter === 'Venkatesha' ? 'Venkatesh' : selectedMemberFilter;
      document.getElementById('dailyLabel').innerText = `DAILY EXPENSES (${displayLabel.toUpperCase()})`;
      document.getElementById('chartTitle').innerText = `Category Breakdown (${displayLabel})`;
      document.getElementById('entryCount').innerText = `${filtered.length} item${filtered.length === 1 ? '' : 's'}`;

      const list = document.getElementById('expenseList');

      let mTotal = 0;
      let fTotal = 0;
      const categoryTotals = {};

      filtered.forEach(item => {
        const amt = Number(item.amount) || 0;
        if (item.type === 'Fixed / Investment') fTotal += amt;
        else mTotal += amt;
        categoryTotals[item.category] = (categoryTotals[item.category] || 0) + amt;
      });

      document.getElementById('monthlyTotal').innerText = '₹' + mTotal.toLocaleString();
      document.getElementById('fixedTotal').innerText = '₹' + fTotal.toLocaleString();

      // Update Budget Progress Bar
      document.getElementById('budgetDisplay').innerText = '₹' + monthlyBudget.toLocaleString();
      const pct = monthlyBudget > 0 ? Math.round((mTotal / monthlyBudget) * 100) : 0;
      const bar = document.getElementById('budgetBar');
      const pctLabel = document.getElementById('budgetPercent');
      bar.style.width = Math.min(pct, 100) + '%';
      pctLabel.innerText = pct + '%';

      if (pct >= 100) {
        bar.className = "bg-red-500 h-2.5 rounded-full transition-all duration-300";
        pctLabel.className = "font-bold text-red-600";
      } else if (pct >= 75) {
        bar.className = "bg-amber-500 h-2.5 rounded-full transition-all duration-300";
        pctLabel.className = "font-bold text-amber-600";
      } else {
        bar.className = "bg-emerald-500 h-2.5 rounded-full transition-all duration-300";
        pctLabel.className = "font-bold text-emerald-600";
      }

      // Render List
      if (filtered.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No expenses recorded for ${displayLabel} in this month.</p>`;
      } else {
        list.innerHTML = filtered.map(item => {
          const amt = Number(item.amount) || 0;
          return `
            <div onclick="startEdit('${item.id}')" class="cursor-pointer hover:bg-indigo-50/50 transition flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-xs">
              <div>
                <div class="font-semibold text-slate-800">${item.category} <span class="text-[10px] text-indigo-600 font-normal">(${item.member})</span></div>
                <div class="text-slate-400 text-[10px]">${item.date} • ${item.paymentMode} ${item.note ? '• ' + item.note : ''}</div>
              </div>
              <div class="flex items-center gap-2">
                <span class="font-bold ${item.type === 'Fixed / Investment' ? 'text-emerald-600' : 'text-slate-800'}">₹${amt.toLocaleString()}</span>
                <button onclick="deleteExpense(event, '${item.id}')" class="text-slate-300 hover:text-red-500 font-bold px-1.5 py-0.5 text-sm">×</button>
              </div>
            </div>
          `;
        }).join('');
      }

      renderChart(categoryTotals);
    }

    function renderChart(categoryTotals) {
      const canvas = document.getElementById('expenseChart');
      const noData = document.getElementById('noChartData');
      const labels = Object.keys(categoryTotals);
      const values = Object.values(categoryTotals);

      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }

      if (labels.length === 0 || typeof Chart === 'undefined') {
        canvas.classList.add('hidden');
        noData.classList.remove('hidden');
        return;
      }

      canvas.classList.remove('hidden');
      noData.classList.add('hidden');

      chartInstance = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#64748b'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { boxWidth: 10, font: { size: 11 } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
